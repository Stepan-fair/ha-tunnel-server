name: Versioned HA application image
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  security-tests:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Require production context to match tested sources
        run: python .github/verification/tools/verify_release_context.py --repository . --component __ROLE__
      - name: Verify browser access commands without secure-context randomUUID
        working-directory: .github/verification
        run: node tests/command_id.test.cjs
      - name: Verify visible financial summary and polling
        working-directory: .github/verification
        run: node tests/billing_overview.test.cjs
      - name: Verify exact transfer confirmation and one pending request
        working-directory: .github/verification
        run: node tests/transfer_dialog.test.cjs
      - name: Verify explicit clock repair controls
        working-directory: .github/verification
        run: node tests/clock_repair_ui.test.cjs
      - name: Verify truthful dependency status
        working-directory: .github/verification
        run: node tests/dependency_status_ui.test.cjs
      - name: Verify canonical notification controls for both roles
        working-directory: .github/verification
        run: node tests/notification_settings.test.cjs
      - name: Build isolated Linux verification image
        run: docker build -t ha-tunnel-verification -f .github/verification/tools/Dockerfile.test .github/verification
      - name: Require real FRP Nginx and MQTT tests with no skips
        run: docker run --rm --network none --memory 768m --cpus 2 --pids-limit 256 ha-tunnel-verification python tools/security_ci.py
  build:
    needs: security-tests
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        arch: [amd64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Bind candidate to exact workflow source and version
        id: release
        env:
          RELEASE_REF: ${{ github.ref }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os,re,pathlib,subprocess
          config=pathlib.Path('__ROLE__/config.yaml').read_text()
          version=re.search(r'^version: "([0-9]+\.[0-9]+\.[0-9]+)"$',config,re.M).group(1)
          revision=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert revision==os.environ['SOURCE_REVISION']
          if os.environ['RELEASE_REF'].startswith('refs/tags/'):
              assert os.environ['RELEASE_REF']=='refs/tags/v'+version
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('version='+version+'\n')
          PY
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build the only production candidate
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ./__ROLE__
          platforms: linux/${{ matrix.arch }}
          push: false
          outputs: type=oci,dest=candidate.tar
          sbom: true
          provenance: mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/Stepan-fair/ha-tunnel-__ROLE__
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify complete candidate graph and attestations
        env:
          REVISION: ${{ github.sha }}
          VERSION: ${{ steps.release.outputs.version }}
        run: python .github/verification/tools/oci_candidate.py verify --archive candidate.tar --revision "$REVISION" --version "$VERSION" --record candidate.json
      - name: Install image transport
        run: sudo apt-get update && sudo apt-get install -y skopeo
      - name: Copy runnable candidate for smoke without rebuilding
        run: |
          skopeo copy --override-os linux --override-arch amd64 oci-archive:candidate.tar docker-daemon:ha-tunnel-candidate:smoke
          docker image inspect ha-tunnel-candidate:smoke > smoke-inspection.json
      - name: Verify smoke config and filesystem identities
        env:
          REVISION: ${{ github.sha }}
          VERSION: ${{ steps.release.outputs.version }}
        run: python .github/verification/tools/oci_candidate.py smoke --archive candidate.tar --revision "$REVISION" --version "$VERSION" --record candidate.json --inspection smoke-inspection.json
      - name: Smoke actual production imports cryptography and linked FRP
        run: |
          set -o pipefail
          docker run --rm --network none --memory 768m --cpus 2 --pids-limit 128 --cap-drop ALL --security-opt no-new-privileges --entrypoint python ha-tunnel-candidate:smoke -c "import __ROLE__.app.main, ssl, sys; from cryptography.hazmat.backends.openssl.backend import backend; from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey; key=Ed25519PrivateKey.generate(); data=b'OCI smoke'; key.public_key().verify(key.sign(data),data); print(sys.version); print(ssl.OPENSSL_VERSION); print(backend.openssl_version_text())" | tee smoke-runtime.txt
          docker run --rm --network none --memory 768m --cpus 2 --pids-limit 128 --cap-drop ALL --security-opt no-new-privileges --entrypoint sh ha-tunnel-candidate:smoke -c 'for file in /usr/local/bin/frp?; do "$file" --version; done; cat /usr/share/doc/frp/*-build.txt /usr/share/doc/frp/*-vulncheck.txt' | tee frp-evidence.txt
      - name: Fresh linked-symbol check of exact candidate binary against current Go DB
        env:
          REVISION: ${{ github.sha }}
          VERSION: ${{ steps.release.outputs.version }}
        run: python .github/verification/tools/check_candidate_go.py --archive candidate.tar --record candidate.json --revision "$REVISION" --version "$VERSION" --component __ROLE__ --output go-evidence
      - name: Scan original complete OCI archive including unfixed findings
        run: |
          docker run --rm --memory 768m --cpus 2 --pids-limit 128 --cap-drop ALL --security-opt no-new-privileges -v "$PWD/candidate.tar:/candidate.tar:ro" -e GRYPE_DB_CACHE_DIR=/tmp/grype-db ghcr.io/anchore/grype@sha256:a640dcef403cda894efcba631ceb45ea324060771ce89d736598895ae1d18418 oci-archive:/candidate.tar --platform linux/amd64 -o json > image-scan.json
      - name: Require scan and smoke to describe this unchanged candidate
        env:
          REVISION: ${{ github.sha }}
          VERSION: ${{ steps.release.outputs.version }}
        run: python .github/verification/tools/oci_candidate.py gate --archive candidate.tar --revision "$REVISION" --version "$VERSION" --record candidate.json --scan image-scan.json --inspection smoke-inspection.json
      - name: Prepare isolated TLS registry for real copy rehearsal
        run: |
          mkdir -p "$RUNNER_TEMP/registry-tls" "$HOME/.config/containers/certs.d/localhost:5443"
          openssl req -x509 -newkey rsa:3072 -nodes -keyout "$RUNNER_TEMP/registry-tls/key.pem" -out "$RUNNER_TEMP/registry-tls/cert.pem" -days 1 -subj /CN=localhost -addext subjectAltName=DNS:localhost
          cp "$RUNNER_TEMP/registry-tls/cert.pem" "$HOME/.config/containers/certs.d/localhost:5443/ca.crt"
          docker run -d --name candidate-registry --memory 256m --cpus 1 --pids-limit 128 -p 127.0.0.1:5443:5000 -v "$RUNNER_TEMP/registry-tls:/certs:ro" -e REGISTRY_HTTP_TLS_CERTIFICATE=/certs/cert.pem -e REGISTRY_HTTP_TLS_KEY=/certs/key.pem registry@sha256:ddf754342cfc8acc51a56d5d0ab6af06826461864460636d8bd5c546dab2a7b8
          for attempt in $(seq 1 20); do
            if curl --fail --silent --cacert "$RUNNER_TEMP/registry-tls/cert.pem" https://localhost:5443/v2/; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Rehearse original archive publication and full TLS registry readback
        env:
          REVISION: ${{ github.sha }}
          VERSION: ${{ steps.release.outputs.version }}
        run: python .github/verification/tools/oci_candidate.py rehearse --archive candidate.tar --revision "$REVISION" --version "$VERSION" --record candidate.json --scan image-scan.json --inspection smoke-inspection.json --target "localhost:5443/ha-tunnel-candidate:$VERSION" --ca "$RUNNER_TEMP/registry-tls/cert.pem"
      - name: Preserve complete fixed and unfixed findings and candidate identities
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: __ROLE__-${{ matrix.arch }}-candidate-evidence
          path: |
            candidate.json
            image-scan.json
            smoke-inspection.json
            smoke-runtime.txt
            frp-evidence.txt
            go-evidence/
          if-no-files-found: warn
      - name: Check bounded original OCI archive for diagnostic retention
        id: candidate-archive
        if: always()
        run: |
          python - <<'PY'
          import os, stat
          from pathlib import Path
          try:
              metadata = Path('candidate.tar').lstat()
              present = stat.S_ISREG(metadata.st_mode) and 0 < metadata.st_size <= 8 * 1024**3
          except OSError:
              present = False
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('present=' + str(present).lower() + '\n')
          if not present:
              print('No bounded regular candidate archive available for diagnostics')
          PY
      - name: Preserve original OCI archive with SBOM and provenance
        if: always() && steps.candidate-archive.outputs.present == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: __ROLE__-${{ matrix.arch }}-oci-candidate
          path: candidate.tar
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Stop isolated registry
        if: always()
        run: docker rm -f candidate-registry 2>/dev/null || true
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Download original immutable OCI candidate
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: __ROLE__-amd64-oci-candidate
          path: .
      - name: Download candidate gate records
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: __ROLE__-amd64-candidate-evidence
          path: .
      - name: Install image transport
        run: sudo apt-get update && sudo apt-get install -y skopeo
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish original verified archive once and verify complete registry graph
        env:
          REVISION: ${{ github.sha }}
          VERSION: ${{ needs.build.outputs.version }}
          IMAGE: ghcr.io/stepan-fair/ha-tunnel-__ROLE__-amd64
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export REGISTRY_AUTH_FILE="$HOME/.docker/config.json"
          python .github/verification/tools/oci_candidate.py publish --archive candidate.tar --revision "$REVISION" --version "$VERSION" --record candidate.json --scan image-scan.json --inspection smoke-inspection.json --target "$IMAGE:$VERSION"
