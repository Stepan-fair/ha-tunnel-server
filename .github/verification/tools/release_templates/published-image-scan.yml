name: Published image security scan
on:
  schedule:
    - cron: '37 4 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/published-image-scan.yml'
      - '.github/verification/tools/scan_published_image.py'
      - '.github/verification/tools/check_image_scan.py'
      - '.github/verification/tests/test_published_image_scan.py'
permissions:
  contents: read
concurrency:
  group: published-image-scan-${{ github.event.pull_request.number || 'release' }}
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Read latest published stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p published-scan
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" > published-scan/release.json
      - name: Install read-only registry transport
        run: sudo apt-get update && sudo apt-get install -y skopeo
      - name: Resolve immutable published runtime image
        id: target
        run: python .github/verification/tools/scan_published_image.py resolve --role __ROLE__ --release published-scan/release.json --target published-scan/target.json
      - name: Scan exact digest with a fresh database including unfixed findings
        env:
          PUBLISHED_IMAGE: ${{ steps.target.outputs.image }}
        run: |
          docker run --rm --memory 768m --cpus 2 --pids-limit 128 --cap-drop ALL --security-opt no-new-privileges \
            -e GRYPE_DB_CACHE_DIR=/tmp/grype-db -e GRYPE_DB_AUTO_UPDATE=true -e GRYPE_DB_REQUIRE_UPDATE_CHECK=true \
            -e GRYPE_DB_VALIDATE_AGE=true -e GRYPE_DB_MAX_ALLOWED_BUILT_AGE=48h \
            ghcr.io/anchore/grype@sha256:a640dcef403cda894efcba631ceb45ea324060771ce89d736598895ae1d18418 \
            "registry:$PUBLISHED_IMAGE" --platform linux/amd64 -o json > published-scan/image-scan.json
      - name: Verify identity freshness and fixable severe findings
        run: python .github/verification/tools/scan_published_image.py check --target published-scan/target.json --scan published-scan/image-scan.json
      - name: Preserve complete findings even after failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: __ROLE__-published-image-scan
          path: published-scan/
          if-no-files-found: error
          retention-days: 30
