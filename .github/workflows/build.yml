name: Versioned HA application image
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  packages: write
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        arch: [amd64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate immutable release version
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os,re,pathlib
          config=pathlib.Path('server/config.yaml').read_text()
          version=re.search(r'^version: "([0-9]+\.[0-9]+\.[0-9]+)"$',config,re.M).group(1)
          assert os.environ['RELEASE_TAG']=='v'+version
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('version='+version+'\n')
          PY
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse replacement of a published image
        env:
          IMAGE: ghcr.io/stepan-fair/ha-tunnel-server-${{ matrix.arch }}
          VERSION: ${{ steps.release.outputs.version }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/guard_image.py
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ./server
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ghcr.io/stepan-fair/ha-tunnel-server-${{ matrix.arch }}:${{ steps.release.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/Stepan-fair/ha-tunnel-server
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
