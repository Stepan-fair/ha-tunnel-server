name: Anonymous external route acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install locked verifier dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/route-verifier"
          "$RUNNER_TEMP/route-verifier/bin/python" -m pip install --require-hashes -r .github/verification/requirements.lock
      - name: Check HTTPS shell and anonymous WebSocket greeting
        working-directory: .github/verification
        env:
          HA_TUNNEL_ACCEPTANCE_ORIGINS: ${{ secrets.HA_TUNNEL_ACCEPTANCE_ORIGINS }}
        run: '"$RUNNER_TEMP/route-verifier/bin/python" -m tools.external_acceptance'
